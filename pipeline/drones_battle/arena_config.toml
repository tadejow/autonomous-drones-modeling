# Drone battle 3 vs 3: all numbers of the game in one place.
# Read by arena_orchestrator.py, tournament.py and (start positions) start_arena.sh.
# Missing keys fall back to the defaults in core/config.py.

[arena]
# NED origin = the defenders' base (south end of the CMAC airfield).
origin_lat_deg = -35.36335
origin_lon_deg = 149.16500
ground_alt_amsl_m = 584.0
attacker_start_north_m = 150.0   # attackers' row lies 150 m north of the base
start_spacing_m = 5.0            # the specification proposes 2 m; 5 m keeps markers readable
takeoff_alt_m = 15.0
# Soft geofence (Safety Limiter).
north_min_m = -40.0
north_max_m = 210.0
east_min_m = -60.0
east_max_m = 60.0
alt_min_m = 3.0
alt_max_m = 40.0

[game]
attacker_ids = [1, 2, 3]         # = SysID of the SITL instances
defender_ids = [4, 5, 6]
tick_hz = 10.0
max_time_s = 120.0
countdown_s = 3.0
kill_radius_m = 2.0
target_radius_m = 5.0
target_alt_m = 10.0              # target point = 10 m above the defenders' base
defender_exclusion_radius_m = 8.0  # anti-camping rule; 0 disables it (pure specification)
kill_mode = "land"               # "land" (specification) or "freefall" (disarm in the air)
mutual_kill = true               # kamikaze defenders: the defender dies together with the attacker

[safety]
attacker_max_speed_mps = 10.0
defender_max_speed_mps = 10.0    # balance knob (with kamikaze defenders: 10 -> ~41%, 9 -> ~44% attacker wins)
max_vertical_speed_mps = 3.0
fence_margin_m = 5.0
fence_gain = 1.0
fence_return_speed_mps = 2.0

[sandbox]
isolation = "process"            # "inline" = same process, for debugging with breakpoints
tick_budget_s = 0.03
max_late_s = 3.0
max_restarts = 3

[sitl]
connection_mode = "udp"          # "udp": --out ports 14550..14600; "tcp": direct 5760..5810 (--no-mavproxy)
udp_base_port = 14550
map_udp_base_port = 14650
tcp_base_port = 5760
port_step = 10
connect_timeout_s = 60.0
takeoff_timeout_s = 90.0
stale_after_s = 1.0
position_rate_hz = 10.0
wind_speed_mps = 0.0
wind_direction_deg = 0.0
end_mode = "LAND"

[kinematic]
tau_s = 0.6                      # velocity time constant; calibrate against a SITL step response
max_accel_mps2 = 6.0
position_noise_std_m = 0.0
land_speed_mps = 1.5
seed = 0

[visualization]
trail_length = 300
pause_s = 0.05
topdown = false
